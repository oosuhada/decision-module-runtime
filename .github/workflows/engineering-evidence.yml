name: Engineering evidence

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  graph-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm benchmark:graph
      - run: pnpm build
